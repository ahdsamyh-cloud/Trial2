# Development dependencies only (run API/web with pnpm on the host).
#   cp infra/.env.dev.example infra/.env   # then put your own random values in it (git-ignored)
#   docker compose -f infra/compose.dev.yml up -d
# SECURITY: no passwords in this file; compose refuses to start until they are set.
name: ldms-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ldms_owner
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?set DEV_POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ldms
      LDMS_APP_DB_PASSWORD: ${DEV_APP_DB_PASSWORD:?set DEV_APP_DB_PASSWORD in infra/.env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./postgres/init-dev.sh:/docker-entrypoint-initdb.d/init.sh:ro]
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
  clamav:
    image: clamav/clamav:1.4
    ports: ["127.0.0.1:3310:3310"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ldmsdev
      MINIO_ROOT_PASSWORD: ${DEV_MINIO_ROOT_PASSWORD:?set DEV_MINIO_ROOT_PASSWORD in infra/.env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio:/data]
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes: { pgdata: {}, minio: {} }

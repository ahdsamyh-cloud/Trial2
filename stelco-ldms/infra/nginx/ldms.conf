# Reverse proxy in the DMZ (rendered by the modsecurity-crs nginx image). Only this is published.
limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
  listen 8080;
  server_name ${SERVER_NAME};
  # Redirect to the configured name, never to the client-supplied Host header.
  return 301 https://${SERVER_NAME}$request_uri;
}

# nosemgrep: generic.nginx.security.missing-ssl-version.missing-ssl-version -- TLS 1.2/1.3 are pinned right after listen
server {
  listen 8443 ssl;
  ssl_protocols TLSv1.2 TLSv1.3;
  http2 on;
  server_name ${SERVER_NAME};
  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;

  server_tokens off;
  client_max_body_size 55m;
  client_body_timeout 30s;
  limit_conn conn 50;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Optional: admin pages from the office network only (also enforced by the API allow-list).
  # location /admin { allow 10.0.0.0/8; deny all; proxy_pass ${BACKEND}; }

  # Upstream headers. Host is the configured name, not the client-supplied Host header.
  proxy_http_version 1.1;
  proxy_set_header Host ${SERVER_NAME};
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 120s;

  location = /api/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass ${BACKEND}; }
  location / {
    limit_req zone=perip burst=60 nodelay;
    proxy_pass ${BACKEND};
  }
}

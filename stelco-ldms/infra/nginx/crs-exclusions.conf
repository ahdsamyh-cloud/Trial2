# Narrow OWASP CRS exclusions for LDMS (keep this list short and reviewed).
# Uploads of legal documents and saved emails legitimately contain SQL-like or script-like text.
SecRule REQUEST_URI "@beginsWith /api/documents" "id:1000,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=attack-sqli;FILES_CONTENT"
SecRule REQUEST_URI "@beginsWith /api/intake" "id:1001,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=attack-xss;FILES_CONTENT"
# Comments and summaries are free text written by lawyers.
SecRule REQUEST_URI "@rx ^/api/matters/[^/]+/comments$" "id:1002,phase:1,pass,nolog,ctl:ruleRemoveTargetById=942100;ARGS:body"
